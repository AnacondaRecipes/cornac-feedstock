{% set name = "cornac" %}
{% set version = "3.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/PreferredAI/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 67b4a6638fcb3c530275f0d5bddd2dc95686db44758b0f1a3879d99b3dc6288d

build:
  number: 0
  script:
    # build extra modules
    # https://github.com/PreferredAI/cornac/blob/v2.6.0/setup.py#
    - {{ PYTHON }} setup.py build_ext -j{{ CPU_COUNT }}
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
    - cython >=0.29.21
    - numpy {{ numpy }}
    - scipy
    - libgomp  # [linux]
    - llvm-openmp  # [osx or (win and arm64)]
    - vcomp14  # [win and x86_64]
    - numpy >2.0.0
  run:
    - python
    # add further pinnings for numpy and scipy
    - numpy >2.0.0
    - scipy
    - tqdm
    - powerlaw
    - libgomp  # [linux]
    - llvm-openmp  # [osx or (win and arm64)]
    - vcomp14  # [win and x86_64]
    - {{ pin_compatible('numpy') }}

test:
  source_files:
    - tests
    - pytest.ini
  imports:
    - cornac
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest
    - pytest-xdist
    - flask

about:
  home: https://cornac.readthedocs.io/
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  summary: A Comparative Framework for Multimodal Recommender Systems
  description: |
    Cornac is a comparative framework for multimodal recommender systems.
    Cornac enables fast experiments and straightforward implementations of new models.
    It is highly compatible with existing machine learning libraries (e.g., TensorFlow, PyTorch).
  doc_url: https://cornac.readthedocs.io
  dev_url: https://github.com/PreferredAI/cornac

extra:
  recipe-maintainers:
    - tqtg
  skip-lints:
    # setup.py build_ext is intentionally used for Cornac's compiled extension
    - deprecated_python_install_command
